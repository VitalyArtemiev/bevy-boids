[package]
name = "bevy-boids"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Opt-in instrumentation. `tracing` is the base span layer; the frontends
# add a sink on top of it. Do NOT enable tracy/tracy_mem for wasm builds
# (tracy-client-sys cannot target wasm).
tracing = ["bevy/trace"]
chrome = ["tracing", "bevy/trace_chrome"]
tracy = ["tracing", "bevy/trace_tracy"]
tracy_mem = ["tracing", "bevy/trace_tracy_memory"]

# Development-only Bevy dylib for fast native iteration. Do NOT combine
# with wasm, and do not enable it for LTO release builds.
dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.19" }

# UI stack: all menus, debug panels and the radial menu are egui
# (immediate mode); key remapping runs through enhanced input actions.
bevy_egui = "0.42"
bevy_enhanced_input = "0.26"

bevy_spatial = { git = "https://github.com/VitalyArtemiev/bevy-spatial", branch = "within", default-features = false, features = ["kdtree"] }
# Vendored fork of 0.14.0: `follow_ground` removed. Its full-world mesh
# raycast cost ~5 ms/frame with 10k boid meshes; the game samples the
# analytic HeightField instead (terrain::camera::focus_camera_on_ground).
bevy_rts_camera = { path = "vendor/bevy_rts_camera" }
fastnoise-lite = "1.1"
rand = "0.9.1"
derive_more = { version = "2.0.1", features = ["full"] }
lazy_static = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }

# Bevy itself stays static and untraced by default: `--features dynamic`
# buys faster native iteration, `--features tracing`/`tracy`/`chrome` buy
# instrumentation, and release keeps LTO compatible with static linking.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
quickcheck = "1.0.3"
#proptest may be better

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
# Nightly: fast codegen for our crate; deps below stay on LLVM for runtime speed.
codegen-backend = "cranelift"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"

# Enable link-time optimizations for release
[profile.fast]
inherits = "release"
lto = "thin"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# Size-optimized profile for web deployment. Build with:
#   cargo build --profile wasm-release --target wasm32-unknown-unknown
[profile.wasm-release]
inherits = "release"
# Optimize for size (also try "z", sometimes it is better).
opt-level = "s"
# Strip symbols AND debuginfo: on wasm, "debuginfo" alone leaves the ~22MB
# "name" section behind. We lose panic backtrace symbolication, fine for web.
strip = "symbols"
