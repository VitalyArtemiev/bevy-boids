[package]
name = "bevy-boids"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Opt-in profiling: cargo run --release --features tracy
# Do NOT enable for wasm builds (tracy-client-sys cannot target wasm).
tracy = ["bevy/trace", "bevy/trace_tracy", "bevy/trace_tracy_memory"]

[dependencies]
bevy = { version = "0.19" }
#bevy = { version = "0.19" }

#bevy_spatial = "0.11.0"
bevy_spatial = { git = "https://github.com/VitalyArtemiev/bevy-spatial", branch = "within", default-features = false, features = ["kdtree"] }
bevy_rts_camera = "0.14.0"
rand = "0.9.1"
derive_more = { version = "2.0.1", features = ["full"] }
lazy_static = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }

# Local dev conveniences (dynamic linking + Tracy) - native only, they
# cannot build for wasm (tracy-client-sys needs a C++ toolchain).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", features = [
    "dynamic_linking",
    "trace",
    "trace_tracy",
    #    "trace_tracy_memory"
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
quickcheck = "1.0.3"
#proptest may be better

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
# Nightly: fast codegen for our crate; deps below stay on LLVM for runtime speed.
codegen-backend = "cranelift"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"

# Enable link-time optimizations for release
[profile.fast]
inherits = "release"
lto = "thin"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# Size-optimized profile for web deployment. Build with:
#   cargo build --profile wasm-release --target wasm32-unknown-unknown
[profile.wasm-release]
inherits = "release"
# Optimize for size (also try "z", sometimes it is better).
opt-level = "s"
# Strip symbols AND debuginfo: on wasm, "debuginfo" alone leaves the ~22MB
# "name" section behind. We lose panic backtrace symbolication, fine for web.
strip = "symbols"
