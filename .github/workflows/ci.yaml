name: CI & Pages Deploy

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check native
        run: cargo check
      - name: Check wasm
        run: cargo check --target wasm32-unknown-unknown

  deploy-pages:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # Must match the wasm-bindgen version in Cargo.lock
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build release wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Run wasm-bindgen
        run: wasm-bindgen --target web --out-dir dist target/wasm32-unknown-unknown/release/bevy_boids.wasm
      - name: Assemble site
        run: |
          cp assets/index.html dist/index.html
          mkdir -p dist/assets
          cp -r assets/. dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
