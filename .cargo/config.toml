# Parallel frontend for local native builds only (nightly-only flag;
# must not leak into CI/stable or wasm builds)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zthreads=6"]

# getrandom 0.3 requires an explicit backend cfg on wasm32
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
