# Parallel frontend for local native builds only (nightly-only flag;
# must not leak into CI/stable or wasm builds)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Zthreads=6", "-C", "link-arg=-fuse-ld=/usr/bin/mold"]

# getrandom 0.3 requires an explicit backend cfg on wasm32
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# Nightly-only: per-profile codegen backend selection (cranelift for dev)
[unstable]
codegen-backend = true
